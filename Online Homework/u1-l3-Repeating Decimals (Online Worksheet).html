<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>MyMasteryLab · S03 online worksheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Mulish:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}.topbar{top:env(safe-area-inset-top,0px)}body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:#fff}:root{--c1:#047857;--c2:#00C1BC;--c3:#FAA71C;--soft:#E8F5F0;--deep:#035E44;--fd:'Comfortaa';--fb:'Mulish';--rq:22px}:root{color-scheme:light;--ink:#1a1a1a;--mute:#5b6168;--line:#d9dde1;--good:#047857;--good-bg:#e3f2ec;--bad:#c92426;--bad-bg:#fbe8e8;--warn:#b5620f;--warn-bg:#fff4de;--teal:#00A7B2;}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#fff;color:var(--ink);font-family:var(--fb),system-ui,sans-serif;font-size:17px;line-height:1.55}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--c2);outline-offset:2px}
sup{font-size:.68em;line-height:0;position:relative;top:-.15em;vertical-align:super}
/* math */
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .12em;line-height:1.05;font-size:.92em}
.fr>span:first-child{border-bottom:1.6px solid currentColor;padding:0 .2em .05em}
.fr>span:last-child{padding:.05em .2em 0}
.rt{display:inline-flex;align-items:flex-start;white-space:nowrap}
.rs{font-size:1.08em;line-height:1;padding-right:1px}
.rr{border-top:1.6px solid currentColor;padding:0 .14em 0 .1em;margin-top:.12em;line-height:1.2}
.rr .fr{margin-top:.1em}
.ov{text-decoration:overline;text-decoration-thickness:1.6px;text-underline-offset:0}
.bx{display:inline-block;width:1.2em;height:1.2em;border:1.6px dashed var(--mute);border-radius:3px;vertical-align:middle}
/* question card */
.q{position:relative;padding:18px 18px 16px;border:2px solid var(--line);border-radius:var(--rq,14px);background:#fff;margin:0 0 16px}
.q.is-right{border-color:var(--good)}
.q.is-wrong{border-color:var(--bad)}
.q-say{font-size:.95rem;color:var(--mute);margin-bottom:6px;font-style:italic}
.q-prompt{font-weight:600;font-size:1.06rem;margin-bottom:6px}
.q-help{font-size:.84rem;color:var(--mute);margin-bottom:10px}
.q-fig{margin:6px 0 12px;color:var(--ink)}
.q-fig svg{max-width:100%;height:auto;display:block}
.nl-pt{fill:var(--c1)}
.nl-lab{fill:var(--c1)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:#fff;min-height:52px;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--c1)}
.opt .ol{flex:0 0 26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:700;background:var(--soft);color:var(--ink)}
.q-multi .opt .ol{border-radius:6px}
.opt.on{border-color:var(--c1);background:var(--soft)}
.opt.on .ol{background:var(--c1);color:#fff}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.right .ol{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.fill-line{font-size:1.15rem;display:flex;flex-wrap:wrap;align-items:center;gap:6px;row-gap:12px}
.blank{width:5.2em;font:inherit;font-size:1rem;padding:6px 8px;border:2px solid var(--line);border-bottom:3px solid var(--c1);border-radius:8px;text-align:center;background:#fff;color:var(--ink)}
sup .blank{width:3.2em;font-size:.85rem;padding:3px 4px;vertical-align:baseline;position:relative;top:-.4em}
.blank.good{border-color:var(--good);background:var(--good-bg)}
.blank.bad{border-color:var(--bad);background:var(--bad-bg)}
.blank.shown{border-color:var(--good);background:var(--good-bg);color:var(--good);font-weight:700}
/* place */
.place{display:flex;flex-direction:column;gap:12px}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:10px;border:2px dashed var(--line);border-radius:12px;background:#fafbfb}
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:56px;min-height:44px;padding:6px 12px;border:2px solid var(--c1);border-radius:10px;background:#fff;font-weight:600;cursor:grab;user-select:none;touch-action:manipulation}
.chip.picked{background:var(--c1);color:#fff;transform:translateY(-2px);box-shadow:0 6px 0 -2px var(--c2)}
.chip.good{border-color:var(--good);background:var(--good-bg);color:var(--ink)}
.chip.bad{border-color:var(--bad);background:var(--bad-bg)}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.bin{border:2px solid var(--line);border-radius:12px;padding:8px;background:var(--soft);min-height:90px;transition:border-color .15s}
.bin.over{border-color:var(--c1)}
.bin-label{font-weight:700;font-size:.9rem;margin-bottom:6px}
.drop{display:flex;flex-wrap:wrap;gap:6px;min-height:46px}
.place-match .bins{grid-template-columns:1fr}
.place-match .bin{display:grid;grid-template-columns:minmax(90px,1fr) 2fr;align-items:center;gap:10px;min-height:0}
.place-match .bin-label{font-size:1.05rem;margin:0}
.place-match .drop{border:2px dashed var(--line);border-radius:10px;background:#fff;padding:4px;min-height:52px}
.place-order .bins{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.place-order .bin{min-height:0;padding:4px;background:#fff;border-style:dashed;min-width:76px}
.place-order .drop{min-height:46px;justify-content:center}
.ord-arrow{font-size:1.4rem;color:var(--mute)}
.ord-end{font-size:.78rem;color:var(--mute);font-weight:600}
/* footer + feedback */
.q-foot{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:10px 20px;font-weight:700;background:var(--c1);color:#fff;min-height:44px;transition:transform .1s}
.btn:active{transform:translateY(1px)}
.btn-ghost{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn-alt{background:var(--teal)}
.fb{margin-top:10px;font-size:.98rem;min-height:1px}
.fb.good{color:var(--good)}
.fb.bad{color:var(--bad)}
.fb.warn{color:var(--warn)}
.ansv{font-weight:700;color:var(--good)}
.explain{margin-top:8px;padding:10px 12px;border-left:4px solid var(--c2);background:var(--soft);border-radius:0 10px 10px 0;font-size:.95rem}
.q-edge::after{content:"Edge case";position:absolute;top:-11px;right:14px;background:#fff;border:2px solid var(--c3);color:var(--ink);font-size:.72rem;font-weight:700;padding:1px 8px;border-radius:999px}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
body{background:#fff}
.screen{max-width:1100px;margin:0 auto;padding:0 16px 56px}
h1,h2,h3,.t-title,.mn-name,.brand,.b-name,.big-num{font-family:var(--fd),var(--fb),sans-serif;letter-spacing:.005em}
h2{font-size:1.7rem;line-height:1.15;margin:.1em 0 .2em}
h3{font-size:1.1rem;margin:0 0 .4em}
.t-kicker{margin:0;color:var(--deep);font-weight:700;font-size:.86rem}
.muted{color:var(--mute)}
.linkbtn{background:none;border:0;color:var(--deep);text-decoration:underline;font-weight:600;padding:4px 0;margin-top:4px}
.btn.big{font-size:1.1rem;padding:14px 28px}
.btn.small{padding:8px 14px;min-height:38px;font-size:.92rem}
/* top bar */
.topbar{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;background:#fff;border-bottom:3px solid var(--c1);margin-bottom:16px;flex-wrap:wrap}
.tb-left{display:flex;align-items:center;gap:10px;min-width:0}
.brand{font-weight:700;color:var(--ink)}
.tb-sep{width:2px;height:18px;background:var(--line)}
.tb-unit{font-size:.9rem;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-right{display:flex;align-items:center;gap:8px}
.xp{font-weight:800;color:var(--deep);background:var(--soft);padding:6px 12px;border-radius:999px;font-size:.9rem}
.xp.pop{animation:pop .5s}
@keyframes pop{50%{transform:scale(1.18)}}
.hp-mini{font-size:.85rem;font-weight:700;color:var(--c1)}
.tb-btn{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:700;font-size:.88rem;min-height:38px}
.tb-btn:hover{border-color:var(--c1)}
/* characters */
.av{width:96px;flex:0 0 auto}
.av svg{width:100%;height:auto;display:block;overflow:visible}
.bob{animation:bob 2.6s ease-in-out infinite}
.float{animation:float 3.4s ease-in-out infinite}
.hop{animation:hop 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes float{50%{transform:translateY(-9px)}}
@keyframes hop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-10px)}}
.blink{animation:blink 4.2s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.flap{animation:flap .5s ease-in-out infinite alternate}
.flap-r{animation-name:flapr}
@keyframes flap{to{transform:rotate(14deg)}}
@keyframes flapr{to{transform:rotate(-14deg)}}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.rise circle{animation:rise 2.4s ease-in infinite}
.rise circle:nth-child(2){animation-delay:.6s}.rise circle:nth-child(3){animation-delay:1.2s}
circle.rise{animation:rise 2.4s ease-in infinite}
@keyframes rise{0%{transform:translateY(8px);opacity:0}30%{opacity:1}100%{transform:translateY(-26px);opacity:0}}
.wave{animation:wave 1.4s ease-in-out infinite alternate}
@keyframes wave{to{transform:rotate(-14deg)}}
.hammer{animation:hammer 1.1s ease-in infinite}
@keyframes hammer{0%,100%{transform:rotate(0)}40%{transform:rotate(-38deg)}55%{transform:rotate(8deg)}}
.flicker{animation:flicker .9s ease-in-out infinite alternate}
@keyframes flicker{to{transform:scale(1.05,.95) skewX(2deg)}}
.tail{animation:wave 1s ease-in-out infinite alternate}
.orbit{animation:spin 6s linear infinite}
.glitch{animation:glitch 2.2s steps(1) infinite}
@keyframes glitch{0%,88%,100%{transform:none;filter:none}90%{transform:translate(4px,-2px);filter:hue-rotate(40deg)}93%{transform:translate(-5px,1px)}96%{transform:translate(2px,2px)}}
.scan{animation:scan 1.6s ease-in-out infinite alternate}
@keyframes scan{to{transform:translateX(20px)}}
.drift ellipse{animation:drift 14s linear infinite alternate}
@keyframes drift{to{transform:translateX(60px)}}
.drift2 path{animation:drift 6s ease-in-out infinite alternate}
.drive{animation:drive 7s linear infinite}
@keyframes drive{from{transform:translateX(-160px)}to{transform:translateX(1100px)}}
.road{animation:road .6s linear infinite}
@keyframes road{to{stroke-dashoffset:-70}}
.fly{animation:fly 9s ease-in-out infinite alternate}
@keyframes fly{from{transform:translate(-260px,40px) rotate(-8deg)}to{transform:translate(260px,-30px) rotate(6deg)}}
.twinkle{animation:pulse 2s infinite}
.flick{animation:pulse 1.1s steps(2) infinite}.flick2{animation:pulse .7s steps(2) infinite}
.beam{animation:beam 1.4s ease-in-out infinite}
@keyframes beam{0%{stroke-dasharray:0 300}60%{stroke-dasharray:260 300}100%{stroke-dasharray:260 300;opacity:0}}
.shrink{animation:shrinkme 2.8s ease-in-out infinite}
@keyframes shrinkme{0%,30%{transform:scale(1)}60%,80%{transform:scale(.5)}}
.spark,.spark2{animation:pulse 1s infinite}
.walk-in{animation:walkin 1s ease-out both}.d2{animation-delay:.25s}
@keyframes walkin{from{transform:translateX(-80px);opacity:0}}
.av.talk{animation:talk .5s ease-in-out 3}
@keyframes talk{50%{transform:translateY(-4px) rotate(-2deg)}}
.av.oops{animation:shake .4s}
.av.cheer{animation:cheer .7s ease-in-out 3}
@keyframes cheer{50%{transform:translateY(-14px) rotate(4deg)}}
/* title */
.hero-scene{position:relative;border-radius:var(--rq);overflow:hidden;border:3px solid var(--c1);aspect-ratio:1000/300;max-height:320px;width:100%}
.hero-scene .scene{position:absolute;inset:0;width:100%;height:100%}
.hero-cast{position:absolute;left:3%;bottom:0;display:flex;gap:6px}
.hero-cast .av{width:min(130px,17vw)}
.title-card{padding:18px 4px 8px;max-width:720px}
.t-title{font-size:clamp(2.2rem,6vw,3.6rem);line-height:1.02;margin:.15em 0 .1em;color:var(--deep)}
.t-sub{font-size:1.25rem;font-weight:700;margin:0 0 .4em}
.t-hero{font-size:1.08rem;color:#333;margin:0 0 1em}
.t-name{display:flex;flex-direction:column;gap:6px;font-weight:700;max-width:360px;margin-bottom:16px}
.t-name input,.refl textarea{font:inherit;padding:10px 12px;border:2px solid var(--line);border-radius:10px;font-weight:400}
.t-actions{display:flex;gap:10px;flex-wrap:wrap}
/* story & dialogue */
.story-wrap{position:relative}
.story-scene{border-radius:var(--rq);overflow:hidden;border:3px solid var(--c1);aspect-ratio:1000/260;max-height:280px}
.story-scene svg{width:100%;height:100%;display:block}
.dlg{margin-top:-60px;position:relative;z-index:2}
.dlg.compact{margin-top:0}
.dlg.folded .btn{display:none}
.dlg-row{display:flex;align-items:flex-end;gap:12px}
.dlg-row.side-b{flex-direction:row-reverse}
.dlg-row .av{width:110px}
.dlg.compact .dlg-row .av{width:84px}
.bubble{position:relative;flex:1;background:#fff;border:3px solid var(--c1);border-radius:var(--rq);padding:14px 16px;box-shadow:6px 6px 0 var(--soft)}
.b-name{font-weight:700;color:var(--deep);font-size:.95rem}
.b-text{font-size:1.1rem;min-height:3em}
.b-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.b-dots{display:flex;gap:5px}.b-dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.b-dots i.on{background:var(--c1)}
/* hub */
.hub-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.hub-note{margin:0;color:var(--mute)}
.hub-prog{min-width:200px;font-size:.9rem;color:var(--mute)}
.hub-prog b{font-size:1.4rem;color:var(--ink)}
.pbar,.sbar{display:block;height:10px;border-radius:999px;background:var(--soft);overflow:hidden;margin-top:6px}
.pbar i,.sbar i{display:block;height:100%;background:var(--c1);border-radius:999px;transition:width .6s}
.hub-foot{margin-top:24px}
.mnode{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:3px solid var(--c1);background:#fff;border-radius:var(--rq);padding:10px 14px;min-width:150px;transition:transform .15s}
.mnode:hover{transform:translateY(-3px)}
.mn-num{font-weight:800;font-size:.8rem;color:#fff;background:var(--c1);border-radius:999px;padding:0 8px}
.mn-name{font-size:1.02rem;font-weight:700;line-height:1.15}
.mn-meta{font-size:.78rem;color:var(--mute)}
.mnode.st-done{border-color:var(--good)}
.mnode.st-done .mn-num{background:var(--good)}
.stars{display:inline-flex;gap:3px}.stars i{width:14px;height:14px;background:var(--line);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}.stars i.on{background:var(--c3)}
/* islands */
.isl-map{position:relative;aspect-ratio:1000/430;border-radius:24px;overflow:hidden;border:3px solid var(--c1);min-height:360px}
.isl-map>.scene{position:absolute;inset:0;width:100%;height:100%}
.isl-path{position:absolute;inset:0;width:100%;height:100%}
.isl-path path{fill:none;stroke:var(--c1);stroke-width:.5;stroke-dasharray:1.4 1.4;vector-effect:non-scaling-stroke;stroke-width:3}
.mnode.isl{position:absolute;transform:translate(-50%,-50%);border-top:10px solid #66A34E;animation:float 4s ease-in-out infinite;box-shadow:0 10px 0 -4px #D77F28;max-width:170px;min-width:130px}
.mnode.isl:hover{transform:translate(-50%,-55%)}
/* strata */
.hub-strata .lay{display:flex;flex-direction:column;gap:0;border-radius:var(--rq);overflow:hidden;border:3px solid var(--deep)}
.mnode.layer{width:100%;flex-direction:row;align-items:center;gap:14px;border:0;border-radius:0;padding:16px 18px;background:color-mix(in srgb,var(--c2) calc(80% - var(--k)*10%),var(--c1));border-bottom:2px dashed rgba(0,0,0,.18)}
.mnode.layer .mn-num{background:#fff;color:var(--deep);font-size:1rem;padding:2px 10px}
.mnode.layer .mn-name{flex:1;font-size:1.15rem}
.mnode.layer .mn-meta{color:#1a1a1a}
.mnode.layer:hover{transform:translateX(6px)}
/* depth */
.dive{position:relative;padding:10px 0}
.gauge{position:absolute;left:50%;top:0;bottom:0;width:8px;margin-left:-4px;border-radius:8px;background:linear-gradient(var(--c2),var(--c1),#035E44)}
.dive-row{display:flex;align-items:center;gap:14px;margin:12px 0;width:50%}
.dive-row.l{justify-content:flex-end;padding-right:28px}
.dive-row.r{margin-left:50%;padding-left:28px;flex-direction:row-reverse;justify-content:flex-end}
.depth-tag{font-weight:800;color:var(--deep);font-size:.85rem;white-space:nowrap}
.mnode.cham{border-radius:40px 40px 22px 22px;background:var(--soft)}
/* ring */
.ring{position:relative;width:min(640px,100%);aspect-ratio:1;margin:0 auto}
.anvil{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;width:180px}
.anvil .av{width:130px;margin:0 auto}
.anvil p{margin:0;font-weight:700;color:var(--deep)}
.mnode.gem{position:absolute;transform:translate(-50%,-50%);width:150px;min-width:0;align-items:center;text-align:center;clip-path:polygon(50% 0,100% 22%,100% 78%,50% 100%,0 78%,0 22%);border:0;background:linear-gradient(160deg,var(--soft),#fff);padding:28px 12px;box-shadow:inset 0 0 0 3px var(--c1)}
.mnode.gem.st-done{box-shadow:inset 0 0 0 4px var(--good)}
.mnode.gem:hover{transform:translate(-50%,-54%)}
/* track */
.trk{padding:30px 10px 10px}
.trk-road{position:relative;height:46px;border-radius:999px;background:#3a3f44;border:4px solid var(--c3)}
.trk-road::after{content:"";position:absolute;left:12px;right:12px;top:50%;border-top:4px dashed #fff}
.trk-car{position:absolute;top:-58px;transition:left .8s}
.trk-car .av{width:70px}
.trk-cp{position:absolute;top:8px;width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--c2);z-index:1}
.trk-cp.on{background:var(--c1)}
.laps{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-top:22px}
.mnode.lap{border-radius:6px;border-left:12px solid var(--c1);background:repeating-linear-gradient(45deg,#fff 0 10px,var(--soft) 10px 20px)}
/* beakers */
.bench{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px;padding:18px;border-radius:var(--rq);background:var(--soft);border-bottom:10px solid var(--deep)}
.mnode.beaker{align-items:center;text-align:center;border:0;background:transparent;padding:6px}
.bk{width:64px;height:auto;color:var(--deep)}
.bk .liq{fill:var(--c1);opacity:.75;transition:y .6s}
.mnode.beaker .mn-num{margin-top:4px}
/* starmap */
.stars-map{position:relative;aspect-ratio:1000/400;min-height:380px;border-radius:var(--rq);overflow:hidden;border:2px solid var(--c1);box-shadow:inset 0 0 0 6px #fff,inset 0 0 0 8px var(--soft)}
.stars-map>.scene{position:absolute;inset:0;width:100%;height:100%}
.mnode.planet{position:absolute;transform:translate(-50%,-50%);width:132px;min-width:0;aspect-ratio:1;border-radius:50%;align-items:center;justify-content:center;text-align:center;padding:10px;border-width:3px}
.mnode.planet.p1{background:#FFF3E0}.mnode.planet.p2{background:var(--soft)}.mnode.planet.p3{background:#FFF8E6}
.mnode.planet .mn-name{font-size:.86rem}
.mnode.planet .mn-meta{font-size:.68rem}
.mnode.planet:hover{transform:translate(-50%,-56%)}
/* arena */
.boss-card{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;padding:16px;border:4px solid var(--c1);background:var(--soft);box-shadow:8px 8px 0 var(--c1)}
.boss-card .av{width:110px}

  box.innerHTML = '<div class="ws-sec-head"><div><h2>'+title(cur)+'</h2><p class="ws-prog" id="prog"></p></div><button class="btn btn-ghost" id="fresh" type="button">New random set</button></div>';
  app.appendChild(box);
  function prog(){ var x = sc(cur); $('#prog').innerHTML = x.done+' of '+x.n+' answered · <b>'+x.right+' correct</b>'+(x.done===x.n ? ' · '+Math.round(x.right/x.n*100)+'%'+(x.right/x.n>=0.85?' · mastery reached':' · try a new set to reach 85%') : ''); }
  prog();
  $('#fresh').onclick = function(){ if (sc(cur).done && !confirm('Start a new random set for this section? Your current answers here will be replaced.')) return; delete S.sets[cur]; delete S.res[cur]; save(); render(); };
  var list = el('ol','ws-list'); box.appendChild(list);
  qs.forEach(function(q, i){ var li = el('li','ws-item'); li.innerHTML = '<span class="ws-num">'+(i+1)+'</span>'; list.appendChild(li); var restoring = true;
    var v = new QView(q, li, { tries:1, checkLabel:'Check answer', onDone:function(r){ if (restoring) return; S.res[cur][i] = r.correct; save(); prog(); } });
    if (res[i] !== undefined) v.finish(!!res[i], '', false); restoring = false; });
  var foot = el('div','ws-foot'); var nx = tabs[tabs.indexOf(cur)+1]; foot.innerHTML = '<button class="btn" id="nxt" type="button">'+(nx==='R'?'See my results':'Next: '+(nx==='T'?'Mastery test':'Section '+nx))+'</button>'; box.appendChild(foot); $('#nxt').onclick = function(){ cur = nx; render(); window.scrollTo(0,0); };
}
function results(){
  var rows = '', tot = 0, right = 0, done = 0, weakest = null;
  tabs.filter(function(t){ return t!=='R'; }).forEach(function(t){ var s = sc(t); if (!S.sets[t]){ rows += '<tr><td>'+title(t)+'</td><td colspan="3" class="muted">Not started</td></tr>'; return; }
    var p = s.done ? Math.round(s.right/s.n*100) : 0; if (t!=='T'){ tot += s.n; right += s.right; done += s.done; if (s.done && (!weakest || p < weakest[1])) weakest = [t, p]; }
    rows += '<tr><td>'+title(t)+'</td><td>'+s.done+'/'+s.n+'</td><td>'+s.right+'</td><td>'+(s.done? p+'%' : '—')+'</td></tr>'; });
  var pct = done ? Math.round(right/done*100) : 0; var T = L.id==='L8' && S.sets.T ? sc('T') : null;
  var box = el('section','ws-sec');
  var verdict = !done ? 'Answer some questions to see your results.' : (done < tot ? 'Keep going: '+(tot-done)+' questions left. ' : '') + (pct >= 85 ? '<b>Mastery level reached (85% or more).</b>' : '<b>Not yet at 85%.</b> '+(weakest?'Start a new set of Section '+weakest[0]+' ('+title(weakest[0]).split('· ')[1]+') and try again.':''));
  if (T && T.done) verdict += '<br>Mastery assessment: <b>'+T.right+'/20 ('+Math.round(T.right/20*100)+'%)</b> — '+(T.right>=17 ? 'Unit 1 mastered. Ready for Unit 2.' : 'below 85%: your mentor will assign a recovery set before Unit 2.');
  box.innerHTML = '<h2>My results</h2><div class="rep-grid"><div class="rep-card"><h3>Overall practice score</h3><p class="big-num">'+(done? pct+'%' : '—')+'</p><p>'+right+' correct out of '+done+' answered ('+tot+' in total)</p></div><div class="rep-card"><h3>Next step</h3><p>'+verdict+'</p></div></div><div class="rep-card"><div class="tbl-wrap"><table><thead><tr><th>Section</th><th>Answered</th><th>Correct</th><th>Score</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'+
   '<div class="share-row"><button class="btn" id="shr" type="button">Share performance</button><button class="btn btn-ghost" id="cpy" type="button">Copy results</button><a class="btn btn-ghost" id="eml">Email results</a><button class="btn btn-ghost" id="prt" type="button">Print</button></div><p class="toast" id="toast" aria-live="polite"></p><div id="fallback"></div>';
  app.appendChild(box);
  function text(){ var ls = ['MyMasteryLab · '+L.unit, L.sess+' · '+L.title+' · Online practice', 'Learner: '+(S.name||'—'), 'Date: '+new Date().toLocaleString(), 'Overall: '+pct+'% ('+right+'/'+done+' answered, '+tot+' total)'];
    tabs.filter(function(t){ return t!=='R' && S.sets[t]; }).forEach(function(t){ var s = sc(t); ls.push('• '+title(t)+': '+s.right+'/'+s.n+' ('+s.done+' answered)'); });
    ls.push(pct>=85 ? 'Status: mastery level reached' : 'Status: still practising'+(weakest?' (focus: Section '+weakest[0]+')':'')); return ls.join('\n'); }
  $('#eml').href = 'mailto:?subject='+encodeURIComponent('MyMasteryLab '+L.sess+' practice results – '+(S.name||'Learner'))+'&body='+encodeURIComponent(text());
  function toast(t){ $('#toast').textContent = t; setTimeout(function(){ $('#toast').textContent=''; }, 2600); }
  function fallback(){ $('#fallback').innerHTML = '<label class="refl">Copy these results:<textarea rows="8" readonly>'+esc(text())+'</textarea></label>'; $('#fallback textarea').select(); }
  function copy(){ if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text()).then(function(){ toast('Results copied. Paste them into a message to your mentor.'); }, fallback); else fallback(); }
  $('#cpy').onclick = copy; $('#prt').onclick = function(){ window.print(); };
  $('#shr').onclick = function(){ if (navigator.share) navigator.share({ title:'MyMasteryLab practice results', text:text() }).catch(function(e){ if (e && e.name!=='AbortError') copy(); }); else copy(); };
}
document.title = 'MyMasteryLab · '+L.sess+' · Online practice';
render();
})();
</script></body></html>
